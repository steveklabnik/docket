[package]
name = "docket"
version = "0.1.0"
edition = "2021"
description = "Task tracking for AI-assisted development"
license = "MIT"
repository = "https://github.com/steveklabnik/docket"
keywords = ["cli", "task-tracker", "bug-tracker", "ai", "jujutsu"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
whoami = "1"
glob = "0.3"
colored = "2"
dialoguer = { version = "0.11", features = ["editor"] }
anyhow = "1"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/docket-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
